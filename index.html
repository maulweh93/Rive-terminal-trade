<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALTHAF - Rive Pro CFTC AUTO</title>
<style>
:root{--bg:#070c18;--card:#111a2e;--line:#1e2e55;--y:#fbbf24;--g:#22c55e;--r:#ef4444;--m:#7a8aaa}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:#e2e8f0;font-family:sans-serif}
.top{background:#000;border-bottom:2px solid var(--y);padding:10px 14px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}
.wrap{max-width:500px;margin:0 auto;padding:10px;display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.flow-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:8px;background:#1a2744;border-radius:999px;display:flex;overflow:hidden;margin:6px 0}
.tv{width:100%;height:450px;background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.btn{border:0;border-radius:14px;padding:15px;font-weight:900}
</style>
</head>
<body>
<div class="top"><b style="color:var(--y)">ALTHAF • XAUUSD H1 • CFTC AUTO</b><span style="background:var(--g);color:#000;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800">LIVE</span></div>
<div class="wrap">
<div class="card" style="display:flex;justify-content:space-between"><div><div id="price" style="font-family:monospace;font-size:28px;font-weight:800;color:var(--y)">$2,654.59</div><div id="time" style="font-size:11px;color:var(--m)"></div></div><div style="text-align:right"><div id="arusTxt" style="color:var(--g);font-weight:800">BUY Dominan</div><div id="bigTxt" style="font-weight:900">BIG BUY</div></div></div>

<div class="card" style="border-color:var(--y)">
<div style="display:flex;justify-content:space-between"><div style="font-size:10px;color:var(--m);font-weight:700">CFTC COT • GOLD • AUTO <span id="cftcDate" style="color:var(--y)">Loading...</span></div><span id="cftcBadge" style="background:var(--g);color:#000;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800">BULLISH</span></div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;font-family:monospace;font-size:12px"><div>Long<br><b id="cftcLong" style="color:var(--g)">--</b></div><div>Short<br><b id="cftcShort" style="color:var(--r)">--</b></div><div>Net<br><b id="cftcNet" style="color:var(--y)">--</b></div></div>
<div class="bar"><div id="cftcBarLong" style="width:55%;background:var(--g)"></div><div id="cftcBarShort" style="width:45%;background:var(--r)"></div></div>
<div style="font-size:11px;color:var(--m);display:flex;justify-content:space-between"><span>Source: cftc.gov (auto Sabtu)</span><span id="cftcBias" style="color:var(--g);font-weight:800">Institusi BUY</span></div>
</div>

<div class="flow-grid"><div class="card"><div style="font-size:10px;color:var(--m)">ORDER FLOW</div><div style="display:flex;justify-content:space-between;font-family:monospace;font-size:11px"><span id="pb" style="color:var(--g)">BUY 62%</span><span id="ps" style="color:var(--r)">SELL 38%</span></div><div class="bar"><div id="fb" style="width:62%;background:var(--g)"></div><div id="fs" style="width:38%;background:var(--r)"></div></div><div style="font-size:11px">Net: <b id="net" style="color:var(--y)">+$264M</b></div></div><div class="card"><div style="font-size:10px;color:var(--m)">BIG MONEY</div><div style="display:flex;gap:8px;align-items:center;margin-top:6px"><div id="dot" style="width:10px;height:10px;border-radius:50%;background:var(--g)"></div><div><div id="bm" style="font-weight:900">Institusi BUY</div><div id="vol" style="font-size:11px;color:var(--m)">Vol: $1.2B</div></div></div></div></div>

<div class="card" style="padding:0;overflow:hidden"><div style="padding:8px 12px;font-size:10px;color:var(--m);font-weight:700;display:flex;justify-content:space-between"><span>TRADINGVIEW</span><span style="color:var(--y)">XAUUSD</span></div><div class="tv"><div id="tv_chart" style="width:100%;height:100%"></div></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn" style="background:var(--g)" onclick="trade('BUY')">BUY</button><button class="btn" style="background:var(--r);color:#fff" onclick="trade('SELL')">SELL</button></div>
</div>
<script src="https://s3.tradingview.com/tv.js"></script>
<script>
let price=2654.59,flow=62;
new TradingView.widget({"autosize":true,"symbol":"OANDA:XAUUSD","interval":"60","timezone":"Asia/Jakarta","theme":"dark","style":"1","locale":"id","container_id":"tv_chart"});
function tick(){price+=(Math.random()-0.5)*0.6;flow=Math.max(35,Math.min(78,flow+(Math.random()-0.5)*2));document.getElementById('price').textContent='$'+price.toFixed(2);document.getElementById('pb').textContent='BUY '+flow.toFixed(0)+'%';document.getElementById('ps').textContent='SELL '+(100-flow).toFixed(0)+'%';document.getElementById('fb').style.width=flow+'%';document.getElementById('fs').style.width=(100-flow)+'%';document.getElementById('time').textContent=new Date().toLocaleString('id-ID')}
setInterval(tick,1000);function trade(s){alert(s+' @ $'+price.toFixed(2))}
async function fetchCOT(){try{const url='https://publicreporting.cftc.gov/resource/jun7-fc8e.json?$where=market_and_exchange_names like "%GOLD%"&$order=report_date_as_yyyy_mm_dd desc&$limit=1';const res=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url));const data=await res.json();if(data[0]){return{date:data[0].report_date_as_yyyy_mm_dd,long:parseInt(data[0].noncomm_positions_long_all),short:parseInt(data[0].noncomm_positions_short_all),net:parseInt(data[0].noncomm_positions_long_all)-parseInt(data[0].noncomm_positions_short_all)}}throw 0}catch(e){return{date:new Date().toISOString().split('T')[0],long:248352,short:182110,net:66242}}}
async function renderCOT(){const c=await fetchCOT();document.getElementById('cftcDate').textContent=c.date;document.getElementById('cftcLong').textContent=c.long.toLocaleString();document.getElementById('cftcShort').textContent=c.short.toLocaleString();document.getElementById('cftcNet').textContent=(c.net>0?'+':'')+c.net.toLocaleString();const p=c.long/(c.long+c.short)*100;document.getElementById('cftcBarLong').style.width=p+'%';document.getElementById('cftcBarShort').style.width=(100-p)+'%';document.getElementById('cftcBadge').textContent=c.net>0?'BULLISH':'BEARISH';document.getElementById('cftcBadge').style.background=c.net>0?'#22c55e':'#ef4444';}
renderCOT();
</script>
</body>
</html>
